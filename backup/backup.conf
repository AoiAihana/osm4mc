# ============================================================================
#  gis 渲染库定时备份 —— 配置文件
#
#  这是被 `source` 的 shell 片段：一行一个 KEY=VALUE，`#` 开头是注释。
#  脚本**每一轮都会重新读取本文件**，所以改完不用重启调度器
#  （新的 INTERVAL 从下一轮开始生效）。
#
#  用法：
#     ./tools/backup-db.sh run     # 前台调度循环，按 INTERVAL 备份
#     ./tools/backup-db.sh now     # 立刻备份一次
#     ./tools/backup-db.sh help    # 全部子命令
# ============================================================================

# --- 备份周期 ---------------------------------------------------------------
# 支持带单位：30s / 10m / 6h / 1d（不区分大小写）；纯数字按「秒」解释。
# 最小 1 秒。
INTERVAL=6h

# 调度器启动时先立刻备份一次（1），还是先等满一个周期（0）。
RUN_ON_START=1

# --- 备份目标 ---------------------------------------------------------------
# 备份哪个环境：auto = 自动认当前正在跑的那一套；也可以写死 test / prod。
# 两个环境用的是同一个宿主端口（54321），所以只能靠 compose 项目名区分。
ENV_NAME=auto

# 输出目录，相对仓库根目录（写绝对路径也可以）。
BACKUP_DIR=backup

# 容器内的库名与角色，对应 docker-compose.yml 里的 GIS_DB / GIS_USER。
# 库名以 gis- 开头，所以文件名形如 gis-test-20260928-233500.dump。
GIS_DB=gis
GIS_USER=postgres

# --- 保留策略 ---------------------------------------------------------------
# 只保留最新的 N 个备份，更旧的文件会被删除；0 = 全部保留（默认）。
#
# 体积参考：本机 gis 库 1.4 GB，其中 water_polygons 一张表就占 1.2 GB
# （从 osmdata.openstreetmap.de 下载的外部 shapefile，随时可以重新生成）。
# 因此**每个** dump 约 1.2 GB、耗时约 3 分钟。磁盘够就保持 0；不够就配合
# 下面的 EXCLUDE_EXTERNAL_DATA=1 一起用。
KEEP=0

# --- 体积控制 ---------------------------------------------------------------
# 1 = 不备份那几张可以重新下载的外部 shapefile 表
#     （water_polygons / simplified_water_polygons /
#       icesheet_polygons / icesheet_outlines），
#     dump 会从约 1.2 GB 降到几 MB。
#     代价：恢复后要补跑一次 `sync external-data` 才能出图。
EXCLUDE_EXTERNAL_DATA=0

# --- 可靠性 -----------------------------------------------------------------
# zlib 压缩级别 0-9（只对 custom 格式有意义）。这些数据本身压不太动，
# 6 和 9 的体积差别很小。
COMPRESS=6
# 单个 dump 的超时（秒），超时按失败处理；0 = 不限。
DUMP_TIMEOUT=5400
# 是否生成 .sha256 校验文件（1/0）。
CHECKSUM=1

# --- 日志 -------------------------------------------------------------------
# 额外写一份日志文件（调度器模式强烈建议保留）；相对仓库根目录或绝对路径。
# 留空则不写文件，只输出到终端。
LOG_FILE=backup/backup.log
# 日志超过这个字节数就轮转成 .1（只留一份历史）；0 = 不轮转。
LOG_MAX_BYTES=5242880

# --- 环境识别（一般不用改）--------------------------------------------------
# compose 项目名 -> 环境名。
#   test 环境对应项目 osm，prod 环境对应项目 osm-prod（见 tools/switch-env.sh）。
# 如果用的是上游那份 openstreetmap-website/docker-compose.yml，项目名会是
# openstreetmap-website，此时 ENV_NAME=auto 也会照常工作，只是环境名就用
# 项目名本身。
PROJECT_TEST=osm
PROJECT_PROD=osm-prod
