; renderd configuration for the combined openstreetmap-website + carto stack.
;
; The [default] section below is the tile set that mod_tile loads through
; "LoadTileConfigFile /etc/renderd.conf" (see apache-tiles.conf), which makes
; it available under http://<host>:8080/tile/{z}/{x}/{y}.png
;
; The Mapnik XML is compiled from osm-carto4mc's project.mml by the
; container entrypoint. The PostGIS connection details are NOT in project.mml:
; Mapnik/libpq pick them up from the PGHOST/PGUSER/PGDATABASE/PGPASSWORD
; environment variables that docker-compose sets on this container.

[renderd]
socketname=/run/renderd/renderd.sock
num_threads=4
tile_dir=/var/lib/mod_tile
stats_file=/run/renderd/renderd.stats

[mapnik]
plugins_dir=/usr/lib/mapnik/3.1/input
; /usr/share/fonts/truetype/osm-carto is a bind mount of ./data/fonts, where the
; sync service downloads the Noto fonts required by osm-carto4mc.
font_dir=/usr/share/fonts
font_dir_recurse=1

[default]
uri=/tile
xml=/data/mapnik.xml
host=localhost
tiledir=/var/lib/mod_tile
minzoom=0
maxzoom=19
