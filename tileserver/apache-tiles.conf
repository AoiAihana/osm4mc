# mod_tile virtual host: serves the osm-carto4mc tile set rendered by
# renderd straight out of the shared `gis` database.
#
#   http://<host>:8080/tile/{z}/{x}/{y}.png
#
# The tile set itself (its URI, XML stylesheet and zoom range) is declared in
# /etc/renderd.conf and pulled in with LoadTileConfigFile.

<VirtualHost *:8080>
    ServerName localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Where mod_tile keeps the rendered tile / metatile cache. Must match
    # `tile_dir` in renderd.conf.
    ModTileTileDir /var/lib/mod_tile

    # Map the URL path onto the tile set declared in renderd.conf ([default]).
    #
    # LoadTileConfigFile is deliberately NOT used: it registers the tile sets by
    # name but does not pick up their `uri`/`minzoom`/`maxzoom` keys, so no
    # request ever matches a URL path. Its log line was
    #   "Loading tile config default at  for zooms 0 - 20"   (empty URI)
    # and every tile came back as a plain Apache 404.
    AddTileConfig /tile/ default

    # Unix socket renderd listens on (must match `socketname` in renderd.conf).
    ModTileRenderdSocketName /run/renderd/renderd.sock

    ModTileEnableStats On
    ModTileBulkMode Off

    # A request for a tile that has never been rendered blocks until renderd
    # has produced it, so these timeouts have to be generous.
    ModTileRequestTimeout 0
    ModTileMissingRequestTimeout 120

    ModTileMaxLoadOld 16
    ModTileMaxLoadMissing 60

    # Cache heuristics. The sync service expires tiles whenever new edits are
    # applied, so we bias towards freshness rather than long client caching.
    ModTileCacheDurationMax 604800
    ModTileCacheDurationDirty 300
    ModTileCacheDurationMinimum 300
    ModTileCacheDurationMediumZoom 13 86400
    ModTileCacheDurationLowZoom 9 518400
    ModTileCacheLastModifiedFactor 0.20

    # This is a single user / self hosted setup: throttling only gets in the way
    # (it returns 429 when a browser loads many tiles at once).
    ModTileEnableTileThrottling Off

    # The web site runs on a different origin (http://localhost:3000), so the
    # tile server has to allow cross origin reads.
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, HEAD, OPTIONS"
    Header always set Access-Control-Allow-Headers "Range"

    <Location />
        Require all granted
    </Location>

    ErrorLog /dev/stderr
    TransferLog /dev/stdout
    LogLevel warn
</VirtualHost>
