# =============================================================================
#  dyn2xyz 配置文件
#
#  作用：把 Dynmap（dynamic map）格式的瓦片，实时转译成标准 XYZ 瓦片，
#        使输出 URL 可以像任何普通 XYZ 图层一样导入 QGIS / MapLibre / Leaflet。
#
#  本程序不存储任何瓦片：每次 HTTP 请求都是现算 -> 现抓上游 -> 现合成 -> 现返回。
#  唯一的常驻内存是源瓦片的 LRU 缓存（容量见 [render] cache_tiles，进程退出即释放）。
# =============================================================================

[server]
host = "0.0.0.0"
port = 8080
# 对外广播的基地址（写进 TileJSON 的 tiles 字段）。
# 留空则根据请求的 Host 头自动推断——多数情况下留空即可。
public_url = ""
# XYZ 瓦片的挂载路径前缀。最终端点是 <tile_path>/{z}/{x}/{y}.png
# （"/tile/{z}/{x}/{y}.png" 永远作为别名可用）
tile_path = "/tiles"
# 响应头 Access-Control-Allow-Origin，方便浏览器里的地图库直接读取
allow_origin = "*"


# =============================================================================
#  [source] —— 瓦片来源
# =============================================================================
[source]

#  ▼▼▼ 可接受的三种写法（任选其一）▼▼▼
#  ── 写法 1（推荐）：sample_url ──────────────────────────────────────────────
#     直接粘贴一条**真实的** Dynmap 瓦片 URL——从浏览器 F12 网络面板里，
#     或者从地图页面上右键任意一张瓦片复制链接即可。查询串（?timestamp=…）可留可删。
#
#     程序会从这条 URL 里解析出：webroot / world / prefix / 图片格式，
#     并且用它做一次**自检**（分片目录必须等于坐标 >> 5；缩放层级不能超过
#     mapzoomout）——所以粘错地图会立刻报错而不是悄悄出错图。
#
#     随后程序会自动去抓 <webroot>/standalone/dynmap_config.json，
#     从 worldtomap 矩阵里读出瓦片像素、缩放层级与每像素方块数。
#
#     要求的路径形状（本例即此形状）：
#         <webroot>/tiles/<world>/<prefix>/<shardx>_<shardy>/<z前缀>_<x>_<y>.<ext>
#     其中 <shardx>_<shardy> 必须等于 <x>>>5 与 <y>>>5；
#     <z前缀> 是一串字母 z（个数 = zoomout 层级），层级 0 时整段省略，
#     即 level 0 的文件名形如 "<x>_<y>.jpg"。
#
#     ✅ 例（本项目默认值，BiliCraft 的 Paralon / flat 图）：
sample_url = "https://map.bilicraft.com/s2/hyperion/tiles/Paralon/flat/3_1/zzzzz_96_32.jpg?timestamp=1790688914513"
#
#     ✅ 再例（同一站点另一张图，等轴测 surface）：注意程序会**拒绝**等轴测图，
#        因为它的瓦片是斜置菱形网格，无法映射到北朝上的 XYZ 网格。
#        sample_url = "https://map.bilicraft.com/s2/hyperion/tiles/Paralon/t/3_1/zzzzz_96_32.jpg"
#
#  ── 写法 2：webroot + world + prefix ────────────────────────────────────────
#     不想贴完整 URL 时，把这四项分别写出来。image_format 可省略（会从配置里读）。
#         webroot      = "https://map.bilicraft.com/s2/hyperion"
#         world        = "Paralon"
#         prefix       = "flat"
#         image_format = "jpg"          # 可选：png / jpg / jpeg / webp
#
#  ── 写法 3：template —— 完全自定义 URL 模板 ─────────────────────────────────
#     给那些路径规则与标准 Dynmap 不同的服务器（改过 URL 前缀、加了 CDN 等）。
#     模板里可用的占位符（全部就这些，没有别的）：
#
#         {webroot}     见上
#         {world}       世界名
#         {prefix}      地图前缀（含 _day / _night 后缀，若来源里带）
#         {level}       zoomout 层级 L，整数，0 = 原生最细
#         {zoomprefix}  一串 z（L 个）；L=0 时为空字符串
#         {x}           瓦片 x（即 nL_x，可能为负）
#         {y}           瓦片 y —— **已经按 Dynmap 约定取反**，可能为负
#         {shardx}      x >> 5，分片目录
#         {shardy}      y >> 5，分片目录（用的是取反后的 y）
#         {stem}        <zoomprefix>_<x>_<y>；L=0 时为 <x>_<y>
#         {ext}         图片扩展名
#
#     默认模板（与标准 Dynmap 一致，一般不用写）：
#         template = "{webroot}/tiles/{world}/{prefix}/{shardx}_{shardy}/{stem}.{ext}"
#
#  ── 附：额外参数 ────────────────────────────────────────────────────────────
#     附加到每条上游 URL 的查询串（不带前导 ? 或 &）。留空即不加。
#     用于需要 token / CDN 参数的服务器；?timestamp= 这类缓存击穿参数建议**不要**加，
#     因为本程序自己做缓存。
extra_query = ""
#
#     上游请求的 User-Agent 与超时（秒）
user_agent = "dyn2xyz/1.0 (+dynmap-to-xyz tile proxy)"
timeout = 20.0
#
#     存放 dynmap_config.json 的路径（相对 webroot）
config_path = "standalone/dynmap_config.json"


# -----------------------------------------------------------------------------
#  [source.geometry] —— 几何参数
#
#  正常情况下**不用管这一节**：程序会自己去抓 dynmap_config.json 读权威值。
#  但上游是第三方服务、会抖动（实测遇到过 Cloudflare 报
#  `525 SSL Handshake Failed with Origin Server`），如果启动时非抓到不可，
#  一次抖动就会让容器起不来——而它本来只是要几个常量。
#  所以下面预置了一份**已验证**的取值作为兜底：
#
#    抓到了权威值  -> 用权威值，并在日志里说明；
#    抓不到        -> 用这份启动，瓦片照常转译，只是少了一层一致性校验。
#
#  ▼ 下面这份取自本默认源实测读到的 dynmap_config.json。
#    换地图来源时记得同步更新；或把它们注释掉，强制每次启动都去抓。
[source.geometry]
tile_px    = 128    # 瓦片边长像素 = 128 << tilescale
mapzoomout = 5      # 最粗层级；可用层级为 L = 0 … mapzoomout
scale_x    = 4.0    # worldtomap[0]：地图经度 / 方块 X，必须 > 0
scale_z    = -4.0   # worldtomap[5]：地图纬度 / 方块 Z，必须 < 0

#  取值方法：打开地图页面 -> F12 -> 网络 -> 找 standalone/dynmap_config.json ->
#  在 worlds[].maps[] 里找你那张图，抄 worldtomap 的第 1 和第 6 个数。
#  同一份文件里的 tilescale / mapzoomout 也是这两个值的来源。
#  更省事的办法：`python -m app.main --check`，它会把抓到的值打印出来。


# =============================================================================
#  [geo] —— 把 Minecraft 的平面世界摆到地球上的方式
# =============================================================================
[geo]
# 方块 (origin_block_x, origin_block_z) 对应的真实经纬度。
# 默认 0,0 -> 赤道 × 本初子午线，即墨卡托平面坐标原点。
origin_lon = 0.0
origin_lat = 0.0

# 渲染比例：1 方块 = 多少米。默认 1.0。
# 想让地图"看起来更大"就调大它（同样的世界占据更多经纬度）。
meters_per_block = 1.0

# 被钉到上面那个经纬度的方块坐标。
#
# ★ 这个值默认**不是** (0,0)，而是本默认源地图数据的中心。
#   原因：Minecraft 世界里真正渲染过的区域并不在方块原点附近——实测这张图的数据
#   分布在方块 X ∈ [-1024, 23552]、Z ∈ [-17440, 6112]，也就是原点 (0,0) 落在
#   地图的**边角**上。如果按 (0,0) 对齐，打开 iD 只会看到一片空白（实测就是如此）。
#   把它设成数据中心，地图就正好摆在经纬度 (0,0)，iD / QGIS 一打开就能看到。
#
#   这个值是用 tools/scan_extent.py 扫出来的（见 README「排错」一节）：
#       python3 tools/scan_extent.py config/dyn2xyz.toml --seed <有数据的方块坐标>
#   换地图来源后请重新扫一次。
origin_block_x = 11168.0
origin_block_z = -5568.0

# 世界范围（方块坐标 [min_x, min_z, max_x, max_z]），可选。
# 设置后有两个好处：
#   1) TileJSON 会带上精确的 bounds，QGIS 打开时自动定位到你的世界而不是全世界；
#   2) 完全落在范围外的瓦片请求直接返回空图，不再去打扰上游。
# 用 tools/scan_extent.py 可以自动扫出来。下面这份就是扫出来的结果。
# 设置后完全落在范围外的瓦片会直接返回空图，不再去打扰上游。
bounds_blocks = [-1024, -17440, 23552, 6112]


# =============================================================================
#  [render] —— 转译行为
# =============================================================================
[render]
# XYZ 层级超出 Dynmap 原生层后，最多再允许放大几级。
# 这些层级只是把原生层瓦片放大，没有新信息，但 GIS 工具通常希望还能继续放大。
overzoom = 2

# 在 Dynmap 最粗层（mapzoomout）之外，最多再允许缩小几级。
# ⚠️ 每缩小一级，单个 XYZ 瓦片需要的源瓦片数大约翻两番。
#    默认 0 = 严格限制在 Dynmap 能提供的缩放范围内。
#    这里给 1：本默认源的地图数据跨越约 24.6k 方块，而最粗层（L=5）一个瓦片覆盖
#    1024 方块，所以 z=14 一屏只能看到一部分，放到 z=13 才能一眼看全，
#    代价是单张 XYZ 瓦片要拼 5×5=25 张源瓦片（已相应放宽 max_source_tiles）。
underzoom = 1

# 单个 XYZ 瓦片最多允许拼多少个源瓦片；超过就返回空图（并打日志）。
# 这是防止用户缩得太远把上游打挂的安全阀。4×4=16 是默认值。
max_source_tiles = 36

# 并发抓取上游瓦片的线程数与重试。
#
# workers 默认给 16：一张 XYZ 瓦片最多要抓 3×3=9 张源瓦片，16 个 worker 能让它们
# 全部同时发出，而不是分两批（分两批会让最坏耗时翻倍）。
#
# timeout 给 10 秒而不是更长：上游抖动时，宁可较快地退化成一张空白瓦片，
# 也不要让浏览器一直挂着。最坏耗时 ≈ timeout × (retries+1)。
# 注意容器还额外需要足够的网络 MTU 余量，见 docker-compose.yml 里 dyn2xyz-net 的说明。
fetch_workers = 16
fetch_timeout = 5.0
fetch_retries = 1

# 一张 XYZ 瓦片最多等源瓦片多久（秒）。到点就用**已经到手**的源瓦片拼图返回，
# 没等到的那些不取消——它们会在后台跑完并进缓存，下次请求就命中了。
# 这是防止「上游卡住导致浏览器干等」的兜底：慢到超时的瓦片对用户等于没有。
# 调大 = 更完整但更慢；调小 = 更快但更容易出现局部空洞。
# 经验关系：最坏单张源瓦片耗时 ≈ fetch_timeout × (fetch_retries+1)，
# 让它**落在 deadline 之内**，重试才有意义；否则重试还没跑完就被 deadline 掐掉了。
# 默认 5 × 2 = 10s ≤ 12s，是配好的。
render_deadline = 12.0

# 源瓦片的内存 LRU 容量（张）。0 = 关闭缓存。
# 只占内存、不落盘；128×128 的 JPEG 大约 8 KB/张，4096 张约 32 MB。
# 给大一点很划算：一张 XYZ 瓦片要拼约 9 张源瓦片，缓存越大重复浏览时越省上游请求。
cache_tiles = 4096

# 重采样滤镜：nearest / bilinear / bicubic / lanczos
# bilinear 在速度与观感之间比较平衡；lanczos 最锐但慢。
resample = "bilinear"


# =============================================================================
#  [output] —— 输出瓦片
# =============================================================================
[output]
# 输出瓦片边长（像素）。256 是 XYZ 规范值；512 适合高分屏（retina）。
# 注意：改这个**不会**改变缩放层级语义，只影响每张图的像素密度。
tile_px = 256

# 输出背景色（RGBA）。上游缺瓦片（Dynmap 对未渲染/越界区域返回 404）时露出的颜色。
# 默认全透明。想让"没有数据"看起来是一块灰色底，可改成 "#1a1a1a"。
background = "#00000000"

# 当输出格式是有损的 JPEG/WebP 时，透明背景会被压平到这个不透明底色上。
flatten = "#000000"

# JPEG/WebP 质量
jpeg_quality = 82
