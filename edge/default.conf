# Edge reverse proxy: ONE host port for the whole stack.
#
# Why this exists
# ---------------
# The browser - not the server - is what downloads map tiles. The tile services
# are separate HTTP servers on their own ports (tileserver:8080, dyn2xyz:8080),
# so the URLs handed to the browser used to be absolute:
#
#   http://localhost:8080/tile/{z}/{x}/{y}.png     (config/layers.yml)
#   http://localhost:8090/tiles/{z}/{x}/{y}.png    (config/id_imagery.yml)
#
# On the machine running the stack that works by accident. On any OTHER device
# (LAN or through a tunnel) `localhost` is that device itself, so every tile
# request dies with ERR_CONNECTION_REFUSED - no matter how many ports are
# tunnelled, because the browser never contacts this host at all.
#
# Fix: this proxy multiplexes everything behind one port and the two config
# files now use root-relative paths (/tile/..., /tiles/...). The browser then
# asks whatever origin it already loaded the page from, so the same
# configuration works for all of:
#
#   http://localhost:3000/          http://<lan-ip>:3000/
#   http://<frp-host>:<port>/       https://<domain>/        (frp)
#
# Only ONE port has to be forwarded/tunnelled, and it never matters which
# address that is - so a rotating free-tunnel hostname needs no config change.
#
# Routing
# -------
#   /tile/                       -> tileserver:8080  (renderd + mod_tile, osm-carto4mc)
#   /tiles/ /tilejson.json ...   -> dyn2xyz:8080     (Minecraft / Dynmap XYZ tiles)
#   everything else              -> web:3000         (Rails: site, API, iD editor)

# Host header to forward upstream.
#
# $host is the host name WITHOUT the port, so passing it on would make Rails
# (and dyn2xyz's tilejson) think the instance lives on port 80 - which breaks
# absolute URLs such as OAuth redirects when the site is reached as
# http://localhost:3000. $http_host is the verbatim header and keeps the port;
# the empty case only happens for a HTTP/1.0 client without a Host header.
map $http_host $edge_host {
    ""      $host;
    default $http_host;
}

# WebSocket/SSE upgrade handling (the site's socket is not used today, but a
# reverse proxy that silently breaks Upgrade is a nasty surprise later).
map $http_upgrade $edge_connection {
    default upgrade;
    ""      close;
}

# NOTE: upstreams are deliberately NOT declared as `upstream { }` blocks.
# nginx resolves an upstream hostname once, at configuration load, and keeps that
# IP forever - so the moment web/tileserver/dyn2xyz is recreated (compose hands it
# a new IP) this proxy would keep connecting to the dead address and serve 502s
# until somebody also restarted `edge`. `upstream` blocks would additionally make
# nginx refuse to start at all while one of them is down.
# Instead the lookup happens per request, through the resolver + a variable in
# proxy_pass (see below). Do not "simplify" those back to literal hostnames.

server {
    # The container always listens on 8080; only the HOST port is tunable
    # (EDGE_PORT, see docker-compose.yml).
    listen 8080;
    server_name _;

    # 127.0.0.11 is Docker's embedded DNS server; `valid` is how long a resolved
    # address is reused before being looked up again, which is what makes the
    # edge survive upstream container recreation on its own.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $edge_web     http://web:3000;
    set $edge_tiles   http://tileserver:8080;
    set $edge_dyn2xyz http://dyn2xyz:8080;

    # mod_tile blocks until renderd has produced a tile that was never
    # requested before (ModTileMissingRequestTimeout 120 in
    # tileserver/apache-tiles.conf), and dyn2xyz fetches 3x3 upstream tiles per
    # request, so the default 60s read timeout is not enough for either.
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # GPX trace uploads go through here. This is a private instance, so the
    # knob is mostly about not being the 1 MB nginx default. Raise it if a
    # trace upload ever comes back as 413.
    client_max_body_size 64m;
    client_body_timeout  300s;

    # Tile responses are small binaries; sending them straight through keeps
    # the first paint snappy and avoids buffering megabytes to disk.
    proxy_buffering off;
    proxy_request_buffering off;

    # --- healthcheck target for the container itself ---------------------
    # Deliberately served by nginx and NOT proxied: a dead dyn2xyz or
    # tileserver must not make the edge report itself as unhealthy.
    location = /edge-healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- osm-carto4mc tiles (renderd + mod_tile) -------------------------
    # AddTileConfig /tile/ default -> the path mod_tile matches.
    location /tile/ {
        proxy_pass $edge_tiles;
        proxy_http_version 1.1;
        proxy_set_header Host              $edge_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $edge_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # mod_tile already sets its own cache headers; do not add another layer.
    }

    # --- dyn2xyz (Minecraft / Dynmap -> XYZ) -----------------------------
    location /tiles/ {
        proxy_pass $edge_dyn2xyz;
        proxy_http_version 1.1;
        proxy_set_header Host              $edge_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $edge_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Metadata / health endpoints of dyn2xyz. tilejson.json is what QGIS and
    # MapLibre import; it advertises tile URLs built from the Host header
    # (or from `public_url` in dyn2xyz.toml when that is set).
    location = /tilejson.json { proxy_pass $edge_dyn2xyz; include /etc/nginx/edge/proxy-headers.conf; }
    location = /tiles.json    { proxy_pass $edge_dyn2xyz; include /etc/nginx/edge/proxy-headers.conf; }
    location = /status.json   { proxy_pass $edge_dyn2xyz; include /etc/nginx/edge/proxy-headers.conf; }
    location = /healthz       { proxy_pass $edge_dyn2xyz; include /etc/nginx/edge/proxy-headers.conf; }

    # --- everything else: the Rails port (site, API, iD editor) ----------
    location / {
        proxy_pass $edge_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $edge_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $edge_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $edge_connection;
    }
}
