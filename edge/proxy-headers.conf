# Shared proxy_set_header block for the plain (non-tile) dyn2xyz endpoints.
# Kept in its own file so the four `location = ...` blocks stay readable.
proxy_http_version 1.1;
proxy_set_header Host              $edge_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host  $edge_host;
proxy_set_header X-Forwarded-Proto $scheme;
